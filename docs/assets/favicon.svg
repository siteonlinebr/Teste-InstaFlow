<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de Fundo Principal: Índigo Profundo para Ciano Vibrante -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gradiente dos Pixels em Transição / Deslocamento -->
    <linearGradient id="pixelShiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Sombra suave para profundidade no browser tab -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base com Cantos Arredondados Elegantes (Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Borda Sutil Interna de Vidro / Alta Fidelidade -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Pixel 1: Origem (Superior Esquerda) -->
  <g filter="url(#tileShadow)">
    <rect x="13" y="13" width="18" height="18" rx="4" fill="url(#pixelShiftGrad)" />
  </g>

  <!-- Pixel 2: Transformação / Destino (Inferior Direita - Deslocamento "Shift") -->
  <g filter="url(#tileShadow)">
    <rect x="33" y="33" width="18" height="18" rx="4" fill="url(#accentGrad)" />
  </g>

  <!-- Pixel 3: Conexão / Dinâmica (Superior Direita) -->
  <rect x="33" y="17" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity="0.35" />

  <!-- Pixel 4: Ponto de Luz / Brilho Central (Transformação Concluída) -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />
  
  <!-- Mini Setas de Conversão Dinâmica no Centro -->
  <path d="M 23 37 L 27 33 L 23 29" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 41 27 L 37 31 L 41 35" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
