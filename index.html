    <script>
      // Garante carregamento correto de assets relativos no GitHub Pages (evita tela branca)
      if (window.location.hostname.includes('github.io')) {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.includes('.')) {
          window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
        }
      }
    </script>
